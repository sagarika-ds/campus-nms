services:
  database:
    image: postgres:15
    container_name: onms-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - onms-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nms-net

  horizon:
    image: opennms/horizon:latest
    container_name: opennms
    depends_on:
      database:
        condition: service_healthy
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      OPENNMS_DBNAME: opennms
      OPENNMS_DBUSER: opennms
      OPENNMS_DBPASS: opennms
      JAVA_OPTS: -Xms1g -Xmx2g
    command: ["-s"]
    ports:
      - "8980:8980"
    volumes:
      - onms-data:/opt/opennms-overlay
    networks:
      - nms-net

volumes:
  onms-pgdata:
  onms-data:

networks:
  nms-net:
    external: true
    name: campus-nms_nms-net
