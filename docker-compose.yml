version: "3.8"

services:
  snmp-agent:
    build: ./snmp-agent
    container_name: snmp-agent
    networks:
      - nms-net

  snmp-exporter:
    image: prom/snmp-exporter:latest
    container_name: snmp-exporter
    ports:
      - "9116:9116"
    networks:
      - nms-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - nms-net
    depends_on:
      - snmp-exporter
      - snmp-agent

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - nms-net
    depends_on:
      - prometheus

networks:
  nms-net:
    driver: bridge
